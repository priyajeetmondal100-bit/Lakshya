<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrepSphere — Book</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#12343B;--mut:#335961;--line:#B2EBF2;--pri:#00BFA5;--pri2:#00897B;--soft:#E0F7FA;--warn:#e29a0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scrollbar-gutter:stable}
html[data-theme=dark]{--bg:#000000;--card:#000000;--ink:#EDEEEA;--mut:rgba(237,238,234,.66);--line:rgba(237,238,234,.2);--soft:rgba(237,238,234,.08);--pri:#7C4DFF;--pri2:#00E5FF;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;gap:12px;align-items:center;padding:14px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--pri2);font:700 13px/1.2 Manrope,system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:all .15s ease;box-shadow:0 1px 3px rgba(18,52,59,.04)}
.back-btn:hover{background:var(--soft);border-color:var(--pri);color:var(--ink)}
.btn{border:0;background:var(--pri);color:#fff;padding:8px 14px;border-radius:10px;font:700 13px Manrope,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--pri2)}.btn.o{background:transparent;color:var(--pri2);border:1px solid var(--pri)}.btn.o:hover{background:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h1{font-size:24px;margin:4px 0}.mut{color:var(--mut)}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rate button{border:0;background:none;font-size:22px;color:var(--line);cursor:pointer;padding:0 1px}.rate button.on{color:var(--warn)}
.ch{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.ch:last-child{border:0}
.read{min-height:200px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}
/* dark: flat classic finish */
html[data-theme=dark] .logo i{background:var(--pri)!important}
html[data-theme=dark] .av,html[data-theme=dark] .fab,html[data-theme=dark] .avatar{background:var(--pri)!important;box-shadow:none!important}
html[data-theme=dark] .bar b{background:var(--pri)!important}
html[data-theme=dark] .btn:hover{color:#000000}
.bell{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:700;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:800;border:0;cursor:pointer;font-family:inherit}
.menu{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:170px;box-shadow:0 12px 30px rgba(18,52,59,.12);z-index:30}
.menu.open{display:block}.menu a{display:block;padding:8px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}.menu a:hover{background:var(--soft);color:var(--pri2)}
.rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rbar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin:8px 0 14px}.rbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.rctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.rctl input{width:90px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ps_theme")==="dark"?"dark":"light"}catch(e){}</script>
</head><body><div class="wrap">
<div class="top"><button class="back-btn" id="backBtn" type="button" onclick="if(history.length>1&&document.referrer){history.back();}else{location.href='study-books.html';}">← Back</button><b>PrepSphere</b><span style="flex:1"></span><a class="bell" href="notifications.html" title="Notifications" aria-label="Notifications" style="text-decoration:none">🔔 3</a><button class="av" id="avb" aria-label="Profile menu" type="button">A</button><div class="menu" id="menu"><a href="section.html?s=settings">My Profile</a><a href="section.html?s=settings">My Target</a><a href="analysis.html">Progress</a><a href="section.html?s=premium">Subscription</a><a href="section.html?s=settings">Settings</a><a href="#">Logout</a></div></div>
<div class="card"><span class="mut" id="sub"></span><h1 id="title"></h1><div class="mut" id="by"></div>
 <div class="rate" id="rate" style="margin-top:10px"></div><small class="mut" id="rt"></small>
 <div class="acts"><button class="btn" id="dl">Download</button><button class="btn o" id="st"></button><a class="btn o" href="wishlist.html">Go to Wishlist</a></div></div>
<div class="card read" id="readBox"><h2 style="margin-top:0">Chapter 1</h2><p>Your book content opens here. Replace this block with your real PDF or reader (for example an &lt;iframe&gt; pointing to the book file).</p></div>
<div class="card"><h2 style="margin-top:0">Chapters</h2><div id="chs"></div></div>
</div><div class="toast" id="toast"></div>
<script src="../assets/js/ps-data.js"></script>
<script>
const $=i=>document.getElementById(i);
const BOOKS={b1:["Concepts of Physics","H.C. Verma","Physics"],b2:["NCERT Physics Class 11","NCERT","Physics"],b3:["NCERT Biology Class 12","NCERT","Biology"],b4:["Indian Polity","M. Laxmikanth","Polity"],b5:["Organic Chemistry Made Simple","PrepSphere Faculty","Chemistry"]};
const g=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},s=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const p=new URLSearchParams(location.search),id=p.get("id"),mode=p.get("mode")||"view",b=BOOKS[id]||(p.get("t")?[p.get("t"),p.get("a")||"",p.get("s")||""]:["Book not found","",""]);
const PGS={b1:410,b2:280,b3:320,b4:540,b5:360},known=!!(BOOKS[id]||p.get("t")),TOTAL=+p.get("p")||PGS[id]||240,
qs="id="+encodeURIComponent(id)+"&mode=read"+(BOOKS[id]?"":"&t="+encodeURIComponent(b[0])+"&a="+encodeURIComponent(b[1])+"&s="+encodeURIComponent(b[2])+"&p="+TOTAL);
let rec=null;if(known&&window.PSData)rec=PSData.logBook({id:id,title:b[0],author:b[1],subject:b[2],total:TOTAL,q:qs});
let page=rec&&rec.page?rec.page:1;
$("title").textContent=b[0];$("by").textContent=b[1]?"by "+b[1]:"";$("sub").textContent=b[2];document.title="PrepSphere — "+b[0];
$("readBox").hidden=mode!=="read";
if(mode==="read"&&known){
 $("readBox").innerHTML='<div class="rh"><b id="pgLbl"></b><span class="mut" id="pgPct"></span></div><div class="rbar"><i id="pgBar"></i></div><h3 id="pgCh" style="margin:0 0 6px"></h3><p id="pgTx" style="margin:0"></p><div class="rctl"><button class="btn o" id="pgPrev" type="button">← Previous</button><button class="btn" id="pgNext" type="button">Next →</button><label class="mut">Go to page <input id="pgGo" type="number" min="1" max="'+TOTAL+'"></label></div>';
 const CHS=PSData.chapters(TOTAL);
 const draw=()=>{const c=CHS.find(x=>page>=x.start&&page<x.start+x.pages)||CHS[CHS.length-1],r=rec?Math.max(rec.read||0,page):page;
  $("pgLbl").textContent="Page "+page+" of "+TOTAL;$("pgPct").textContent=Math.round(r/TOTAL*100)+"% read";$("pgBar").style.width=Math.round(r/TOTAL*100)+"%";
  $("pgCh").textContent="Chapter "+c.n+" — "+c.title;$("pgTx").textContent="Page "+page+" of "+b[0]+". Your book content opens here. Replace this block with your real PDF or reader.";
  $("pgPrev").disabled=page<=1;$("pgNext").disabled=page>=TOTAL;$("pgGo").value=page};
 const go=n=>{n=Math.max(1,Math.min(TOTAL,Math.round(+n)||1));page=n;rec=PSData.setBookPage(id,n)||rec;draw()};
 $("pgPrev").onclick=()=>go(page-1);$("pgNext").onclick=()=>go(page+1);$("pgGo").onchange=e=>go(e.target.value);
 go(page);
}
$("chs").innerHTML=PSData.chapters(TOTAL).map(c=>`<div class="ch"><span>Chapter ${c.n}</span><span class="mut">${c.pages} pages</span></div>`).join("");
let RT=g("ps_ratings",{}),ST=g("ps_store",[]);
let T;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(T);T=setTimeout(()=>t.classList.remove("show"),2000)}
function paint(){const v=RT[id]||0;$("rate").innerHTML=[1,2,3,4,5].map(n=>`<button data-v="${n}" class="${n<=v?"on":""}" aria-label="${n} stars">★</button>`).join("");$("rt").textContent=v?"Your rating: "+v+"/5":"Rate this book";
 $("st").textContent=ST.some(x=>x.id===id)?"✓ In My Store (Remove)":"♡ Add to Store"}
$("rate").onclick=e=>{const v=e.target.dataset.v;if(v){RT[id]=+v;s("ps_ratings",RT);paint();toast("Thanks for rating!")}};
$("st").onclick=()=>{if(ST.some(x=>x.id===id)){ST=ST.filter(x=>x.id!==id);toast("Removed from store")}else{ST.unshift({id,added:Date.now()});toast("Added to your store ❤️")}s("ps_store",ST);paint()};
$("dl").onclick=()=>{if(!known)return;const ok=PSData.addDownload({id:id,kind:"book",title:b[0],sub:(b[1]?b[1]+" · ":"")+TOTAL+" pages",text:PSData.bookText({title:b[0],author:b[1],subject:b[2],total:TOTAL})});toast(ok?"Saved to Downloads":"Storage is full. Remove a download first")};
$("backBtn").onclick=()=>history.length>1&&document.referrer?history.back():location.href="study-books.html";
paint();
</script>
<script src="../assets/js/navigation-fix.js"></script>
<script>(function(){var b=document.getElementById("avb"),m=document.getElementById("menu");if(!b||!m)return;b.addEventListener("click",function(e){e.stopPropagation();m.classList.toggle("open")});document.addEventListener("click",function(e){if(!m.contains(e.target))m.classList.remove("open")})})();</script>
</body></html>
